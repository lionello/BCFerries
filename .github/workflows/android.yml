name: Android CI

on:
  push:
    branches: [master]
    paths:
      - "Android/**"
  pull_request:
    branches: [master]
    paths:
      - "Android/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Build with Gradle
        working-directory: Android
        run: ./gradlew testDebug
