name: iOS CI

on:
  push:
    branches: [master]
    paths:
      - "iOS/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [master]
    paths:
      - "iOS/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPhone simulator
        # Simulator names change with every Xcode; take whatever iPhone this runner has
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=[d["name"] for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"].startswith("iPhone")]; print(sorted(ds)[-1])')
          echo "Using $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Test
        working-directory: iOS
        run: xcodebuild test -scheme BCFerries -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" CODE_SIGNING_ALLOWED=NO
